[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tenniscareer"
version = "0.1.0"
description = "Fetch a tennis player's career matches from tennisabstract.com and plot age vs. opponent age gap."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Gerald Liu" }]
dependencies = ["pandas", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]